[mypy]
python_version = 3.12
files = app,tests,alembic
strict = True
plugins = pydantic.mypy
warn_unused_configs = True

[mypy-alembic.versions.*]
ignore_errors = True

# Celery ships no py.typed marker; its API is used untyped at the boundary only.
[mypy-celery]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

# pymupdf4llm ships no type information; its API is used untyped at the boundary only.
[mypy-pymupdf4llm]
ignore_missing_imports = True

# Fixture generator script: pymupdf's calls are unannotated; this is test data, not app code.
[mypy-tests.fixtures.*]
disallow_untyped_calls = False
