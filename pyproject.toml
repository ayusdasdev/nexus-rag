[project]
name = "nexus-rag"
version = "0.1.0"
description = "Multi-tenant document Q&A API (RAG)"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "celery==5.6.3",
    "fastapi==0.142.1",
    "fastembed==0.8.1",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "pymupdf4llm==1.28.2",
    "python-multipart==0.0.32",
    "qdrant-client==1.19.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.1",
    "tokenizers==0.23.2",
    "trafilatura==2.3.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
nexus = "cli.nexus_cli:run"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]
